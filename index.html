<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mixtape Radio FM</title><link rel="stylesheet" href="styles.css"></head><body><header><h1>Mixtape Radio FM</h1></header><main><section id="home"><div class="boombox"><div class="lcd"><span id="lcdText">NOW TUNED TO: MIXTAPE RADIO FM</span></div></div><button id="playAllBtn">PLAY</button></section><section id="player"><h2>Cassette Deck</h2><div class="cassette" id="cassette"><div class="reel" id="leftReel"></div><div class="reel" id="rightReel"></div></div><div class="controls"><button id="btnPlay">PLAY</button><button id="btnPause">PAUSE</button><button id="btnStop">STOP</button><button id="btnRewind">REW</button><button id="btnFF">FF</button><button id="btnFlip">FLIP</button></div><div id="trackInfo"><span id="timeMin">00</span>:<span id="timeSec">00</span></div></section><section id="tuner"><h2>Tuner</h2><div id="freqDisplay">94.7 MHz</div><div class="dial"><div id="dialNeedle"></div></div><div id="stationName">Throwback Jams</div></section><section id="tracks"><h2>Tracks</h2><div id="cassetteGrid"></div></section></main><footer><button id="rewindTop">Top</button></footer><script src="script.js"></script></body></html>
